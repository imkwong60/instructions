<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>板遊說明書｜Boardgame Manuals</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --card: #151c2c;
      --card-hover: #1a2336;
      --border: #243044;
      --text: #e8eef8;
      --muted: #8b9bb4;
      --accent: #3b9eff;
      --accent-soft: rgba(59,158,255,0.15);
      --purple: #a78bfa;
      --green: #34d399;
      --danger: #f87171;
      --orange: #fb923c;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
    }
    body {
      min-height: 100dvh; max-width: 960px; margin: 0 auto;
      padding: 0 12px 100px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(100px, env(safe-area-inset-bottom) + 70px);
    }

    /* ===== Header ===== */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: linear-gradient(180deg, var(--bg) 80%, transparent);
      padding: 10px 0 8px;
    }
    .title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .title-row h1 {
      font-size: 1.2rem; font-weight: 700;
    }
    .title-row h1 span {
      background: linear-gradient(90deg, #3b9eff, #a78bfa);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .title-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, transform .1s; font-size: 1rem;
    }
    .icon-btn:active { transform: scale(0.92); background: var(--card-hover); }
    .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-box { position: relative; margin-bottom: 8px; }
    .search-box input {
      width: 100%; padding: 12px 40px 12px 40px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-box input::placeholder { color: var(--muted); }
    .search-box .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 14px;
    }
    .search-box .clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); width: 30px; height: 30px;
      border-radius: 50%; display: none; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
    }
    .search-box .clear.show { display: flex; }

    /* ===== Settings Panel ===== */
    .settings-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 12px; display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-size: 0.9rem; margin-bottom: 10px; color: var(--muted); font-weight: 600;
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 4px;
    }
    .field input {
      width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      font-size: 0.9rem; outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .field .hint { font-size: 0.7rem; color: var(--muted); margin-top: 4px; opacity: 0.85; }
    .settings-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 0.82rem; cursor: pointer;
      white-space: nowrap; transition: all .15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
    }
    .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.ghost:hover, .btn.ghost.active {
      border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
    }
    .btn.danger { border-color: rgba(248,113,113,0.4); color: var(--danger); }

    /* ===== Toolbar ===== */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 6px 0 12px; flex-wrap: wrap;
    }
    .toolbar .count { font-size: 0.82rem; color: var(--muted); }
    .toolbar .count strong { color: var(--accent); font-weight: 600; }
    .status-bar {
      font-size: 0.72rem; color: var(--muted); padding: 0 2px 8px; min-height: 1.2em;
    }
    .status-bar.error { color: var(--danger); }
    .status-bar.ok { color: var(--green); }

    /* ===== Grid ===== */
    .grid {
      display: grid; grid-template-columns: 1fr; gap: 12px;
    }
    @media (min-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; display: flex; flex-direction: column; gap: 8px;
      -webkit-tap-highlight-color: transparent; cursor: pointer;
      transition: background .15s;
    }
    .card:active { background: var(--card-hover); }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
      font-size: 0.68rem; font-weight: 600;
      background: rgba(59,158,255,0.12); color: var(--accent);
      border: 1px solid rgba(59,158,255,0.25); width: fit-content;
    }
    .badge.green { background: rgba(52,211,153,0.12); color: var(--green); border-color: rgba(52,211,153,0.25); }
    .card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.3; word-break: break-word; }
    .card-sub { font-size: 0.8rem; color: var(--muted); }
    .meta { font-size: 0.75rem; color: var(--muted); }
    .empty, .loading {
      grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--muted);
    }
    .empty .emoji { font-size: 2.4rem; margin-bottom: 8px; }
    .loading .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto 12px; animation: spin 0.7s linear infinite;
    }

    /* ===== Floating Upload Button ===== */
    .fab {
      position: fixed; right: 16px; bottom: max(20px, env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #3b9eff, #a78bfa); color: #fff;
      border: none; font-size: 1.6rem; box-shadow: 0 6px 24px rgba(59,158,255,0.45);
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50;
    }
    .fab:active { transform: scale(0.94); }

    /* ===== Toast ===== */
    .toast {
      position: fixed; left: 50%; bottom: max(90px, calc(env(safe-area-inset-bottom) + 80px));
      transform: translateX(-50%) translateY(20px); background: #1e293b; color: var(--text);
      padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 60; white-space: nowrap; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Modal base ===== */
    .modal {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92);
      display: none; flex-direction: column;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    }
    .modal.open { display: flex; }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; gap: 10px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modal-header .title {
      font-size: 0.95rem; font-weight: 600; flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .modal-header .close {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
      background: transparent; color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
    }

    /* ===== Upload Modal ===== */
    .upload-preview {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px;
    }
    .upload-preview .thumb {
      aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #111;
      position: relative; border: 1px solid var(--border);
    }
    .upload-preview .thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .upload-preview .thumb .num {
      position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.7);
      color: #fff; font-size: 0.65rem; padding: 1px 6px; border-radius: 999px;
    }
    .upload-preview .thumb .rm {
      position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(248,113,113,0.9); color: #fff;
      border: none; font-size: 12px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .progress-wrap {
      background: var(--panel); border-radius: 8px; padding: 10px 12px; display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 6px;
    }
    .progress-bar > div {
      height: 100%; background: linear-gradient(90deg, #3b9eff, #a78bfa);
      width: 0%; transition: width .3s;
    }
    .file-input-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; border: 2px dashed var(--border); border-radius: var(--radius);
      background: rgba(255,255,255,0.02); color: var(--muted); font-size: 0.95rem;
      cursor: pointer; transition: all .15s;
    }
    .file-input-btn:active, .file-input-btn.dragover {
      border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
    }

    /* ===== Viewer Modal ===== */
    .viewer-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px; display: flex; flex-direction: column; gap: 12px; align-items: center;
    }
    .viewer-body img {
      width: 100%; max-width: 640px; height: auto; border-radius: 8px;
      background: #111; display: block;
    }
    .viewer-nav {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    }
    .viewer-nav .page { font-size: 0.85rem; color: var(--muted); min-width: 70px; text-align: center; }
    .viewer-nav button {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06); color: #fff; font-size: 1.1rem; cursor: pointer;
    }
    .viewer-nav button:disabled { opacity: 0.3; cursor: default; }

    .highlight { background: rgba(59,158,255,0.35); border-radius: 2px; padding: 0 1px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-row">
      <h1>🎲 <span>板遊說明書</span></h1>
      <div class="title-actions">
        <button class="icon-btn" id="btnSettings" type="button" title="GitHub 設定" aria-label="設定">⚙️</button>
        <button class="icon-btn" id="btnRefresh" type="button" title="重新載入" aria-label="重新載入">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="q" type="search" placeholder="搜尋遊戲名稱…" autocomplete="off" enterkeyhint="search" />
      <button class="clear" id="clearBtn" type="button" aria-label="清除">×</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-panel" id="settingsPanel">
    <h3>GitHub 設定（只存在本機）</h3>
    <div class="field">
      <label>Personal Access Token（需要 repo 權限）</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" />
      <div class="hint">到 GitHub → Settings → Developer settings → Personal access tokens 建立，勾選 repo</div>
    </div>
    <div class="field">
      <label>Owner（用戶名或組織）</label>
      <input type="text" id="ghOwner" placeholder="your-username" />
    </div>
    <div class="field">
      <label>Repository 名稱</label>
      <input type="text" id="ghRepo" placeholder="boardgame-manuals" />
    </div>
    <div class="field">
      <label>Branch（通常 main 或 master）</label>
      <input type="text" id="ghBranch" placeholder="main" value="main" />
    </div>
    <div class="field">
      <label>根目錄路徑（可留空）</label>
      <input type="text" id="ghPath" placeholder="manuals" value="manuals" />
      <div class="hint">圖片會放在 {path}/{遊戲名}/001.jpg …</div>
    </div>
    <div class="settings-actions">
      <button class="btn primary" id="btnSaveSettings" type="button">儲存設定</button>
      <button class="btn ghost" id="btnTestConnection" type="button">測試連線</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="count">顯示 <strong id="shown">0</strong> / <span id="total">0</span> 款遊戲</div>
  </div>
  <div class="status-bar" id="status"></div>

  <div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div>載入中…</div>
  </div>

  <button class="fab" id="fabUpload" type="button" title="上傳說明書" aria-label="上傳">＋</button>
  <div class="toast" id="toast"></div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="title">上傳板遊說明書</div>
      <button class="close" id="uploadClose" type="button" aria-label="關閉">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>遊戲名稱（必填）</label>
        <input type="text" id="gameName" placeholder="例如：卡坦島 / Catan" />
      </div>
      <div class="field">
        <label>備註（可選）</label>
        <input type="text" id="gameNote" placeholder="例如：繁中版、第二版…" />
      </div>

      <label class="file-input-btn" id="fileDrop">
        📷 影相 或 選取相片（可多選）
        <input type="file" id="fileInput" accept="image/*" multiple capture="environment" style="display:none" />
      </label>

      <div class="upload-preview" id="preview"></div>

      <div class="progress-wrap" id="progressWrap">
        <div style="font-size:0.8rem;color:var(--muted)" id="progressText">準備中…</div>
        <div class="progress-bar"><div id="progressBar"></div></div>
      </div>

      <button class="btn primary" id="btnDoUpload" type="button" style="width:100%;padding:14px;margin-top:4px" disabled>
        開始上傳到 GitHub
      </button>
      <div class="hint" style="text-align:center;margin-top:6px">
        圖片會自動壓縮，建議每本說明書 10–40 頁
      </div>
    </div>
  </div>

  <!-- Viewer Modal -->
  <div class="modal" id="viewerModal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="title" id="viewerTitle">說明書</div>
      <button class="close" id="viewerClose" type="button" aria-label="關閉">×</button>
    </div>
    <div class="viewer-body" id="viewerBody">
      <div class="lyrics-status" style="color:var(--muted);padding:20px;text-align:center">載入中…</div>
    </div>
    <div class="viewer-nav">
      <button type="button" id="viewerPrev" aria-label="上一頁">‹</button>
      <div class="page" id="viewerPage">—</div>
      <button type="button" id="viewerNext" aria-label="下一頁">›</button>
    </div>
  </div>

  <script>
    // ========== Config & State ==========
    const LS_KEY = 'bgm_settings_v1';
    const INDEX_FILE = 'index.json';

    let settings = {
      token: '',
      owner: '',
      repo: '',
      branch: 'main',
      path: 'manuals'
    };
    let MANUALS = [];          // from index.json
    let query = '';
    let selectedFiles = [];    // File objects for upload
    let viewerImages = [];
    let viewerIndex = 0;

    // DOM
    const qEl = document.getElementById('q');
    const clearBtn = document.getElementById('clearBtn');
    const grid = document.getElementById('grid');
    const shownEl = document.getElementById('shown');
    const totalEl = document.getElementById('total');
    const statusEl = document.getElementById('status');
    const toastEl = document.getElementById('toast');
    const settingsPanel = document.getElementById('settingsPanel');
    const btnSettings = document.getElementById('btnSettings');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const btnTestConnection = document.getElementById('btnTestConnection');
    const fabUpload = document.getElementById('fabUpload');

    const uploadModal = document.getElementById('uploadModal');
    const uploadClose = document.getElementById('uploadClose');
    const gameNameEl = document.getElementById('gameName');
    const gameNoteEl = document.getElementById('gameNote');
    const fileInput = document.getElementById('fileInput');
    const fileDrop = document.getElementById('fileDrop');
    const previewEl = document.getElementById('preview');
    const btnDoUpload = document.getElementById('btnDoUpload');
    const progressWrap = document.getElementById('progressWrap');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');

    const viewerModal = document.getElementById('viewerModal');
    const viewerClose = document.getElementById('viewerClose');
    const viewerTitle = document.getElementById('viewerTitle');
    const viewerBody = document.getElementById('viewerBody');
    const viewerPage = document.getElementById('viewerPage');
    const viewerPrev = document.getElementById('viewerPrev');
    const viewerNext = document.getElementById('viewerNext');

    // ========== Utils ==========
    function toast(msg, ms) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove('show'), ms || 2400);
    }
    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status-bar' + (type ? ' ' + type : '');
    }
    function loadSettings() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) settings = Object.assign(settings, JSON.parse(raw));
      } catch (e) {}
      document.getElementById('ghToken').value = settings.token || '';
      document.getElementById('ghOwner').value = settings.owner || '';
      document.getElementById('ghRepo').value = settings.repo || '';
      document.getElementById('ghBranch').value = settings.branch || 'main';
      document.getElementById('ghPath').value = settings.path || 'manuals';
    }
    function saveSettings() {
      settings.token = document.getElementById('ghToken').value.trim();
      settings.owner = document.getElementById('ghOwner').value.trim();
      settings.repo = document.getElementById('ghRepo').value.trim();
      settings.branch = document.getElementById('ghBranch').value.trim() || 'main';
      settings.path = document.getElementById('ghPath').value.trim().replace(/^\/|\/$/g, '') || 'manuals';
      localStorage.setItem(LS_KEY, JSON.stringify(settings));
      toast('設定已儲存');
    }
    function hasConfig() {
      return !!(settings.token && settings.owner && settings.repo);
    }
    function slugify(name) {
      return name.trim()
        .replace(/[\/\\?%*:|"<>]/g, '-')
        .replace(/\s+/g, '_')
        .replace(/_+/g, '_')
        .slice(0, 80) || 'untitled';
    }
    function apiHeaders() {
      return {
        'Authorization': 'Bearer ' + settings.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
    }
    function contentUrl(path) {
      return `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`;
    }
    function rawUrl(path) {
      // Works best for public repos
      return `https://raw.githubusercontent.com/${settings.owner}/${settings.repo}/${settings.branch}/${path}`;
    }

    // ========== GitHub helpers ==========
    async function ghGet(path) {
      const res = await fetch(contentUrl(path) + '?ref=' + encodeURIComponent(settings.branch), {
        headers: apiHeaders()
      });
      if (res.status === 404) return null;
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      return res.json();
    }
    async function ghPut(path, contentBase64, message, sha) {
      const body = {
        message: message,
        content: contentBase64,
        branch: settings.branch
      };
      if (sha) body.sha = sha;
      const res = await fetch(contentUrl(path), {
        method: 'PUT',
        headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      return res.json();
    }
    async function testConnection() {
      if (!hasConfig()) {
        toast('請先填寫 Token、Owner、Repo');
        return;
      }
      setStatus('測試連線中…');
      try {
        const res = await fetch(`https://api.github.com/repos/${settings.owner}/${settings.repo}`, {
          headers: apiHeaders()
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.status);
        const data = await res.json();
        setStatus(`連線成功：${data.full_name}（${data.private ? 'Private' : 'Public'}）`, 'ok');
        toast('連線成功');
      } catch (e) {
        setStatus('連線失敗：' + e.message, 'error');
        toast('連線失敗');
      }
    }

    // ========== Index ==========
    async function loadIndex(force) {
      if (!hasConfig()) {
        MANUALS = [];
        render();
        setStatus('請先在右上角設定 GitHub Token 與 Repo', 'error');
        grid.innerHTML = '<div class="empty"><div class="emoji">⚙️</div>請先完成 GitHub 設定<br><small>點右上角齒輪圖示</small></div>';
        return;
      }
      btnRefresh.classList.add('spin');
      setStatus(force ? '正在從 GitHub 載入…' : '載入中…');
      try {
        const indexPath = settings.path + '/' + INDEX_FILE;
        const data = await ghGet(indexPath);
        if (!data || !data.content) {
          MANUALS = [];
          setStatus('尚未有任何說明書（index.json 不存在）');
        } else {
          const json = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
          MANUALS = Array.isArray(json.manuals) ? json.manuals : (Array.isArray(json) ? json : []);
          setStatus('');
        }
        render();
      } catch (e) {
        console.error(e);
        MANUALS = [];
        setStatus('載入失敗：' + e.message, 'error');
        grid.innerHTML = `<div class="empty"><div class="emoji">⚠️</div>無法載入 index.json<br><small>${e.message}</small></div>`;
      } finally {
        btnRefresh.classList.remove('spin');
      }
    }

    async function saveIndex(manuals, commitMsg) {
      const indexPath = settings.path + '/' + INDEX_FILE;
      const payload = {
        updated: new Date().toISOString(),
        manuals: manuals
      };
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
      let sha = null;
      try {
        const existing = await ghGet(indexPath);
        if (existing) sha = existing.sha;
      } catch (e) {}
      await ghPut(indexPath, content, commitMsg || 'Update manuals index', sha);
    }

    // ========== Image compress ==========
    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width, h = img.height;
          if (w > maxWidth) {
            h = Math.round(h * maxWidth / w);
            w = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            if (!blob) return reject(new Error('壓縮失敗'));
            const reader = new FileReader();
            reader.onload = () => {
              const base64 = reader.result.split(',')[1];
              resolve({ base64, size: blob.size, width: w, height: h });
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('無法讀取圖片'));
        };
        img.src = url;
      });
    }

    // ========== Upload flow ==========
    function updatePreview() {
      previewEl.innerHTML = '';
      selectedFiles.forEach((f, i) => {
        const url = URL.createObjectURL(f);
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `
          <img src="${url}" alt="">
          <span class="num">${i + 1}</span>
          <button type="button" class="rm" data-i="${i}">×</button>
        `;
        previewEl.appendChild(div);
      });
      btnDoUpload.disabled = !(gameNameEl.value.trim() && selectedFiles.length);
    }
    previewEl.addEventListener('click', e => {
      const btn = e.target.closest('.rm');
      if (!btn) return;
      const i = +btn.dataset.i;
      selectedFiles.splice(i, 1);
      updatePreview();
    });

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files || []);
      selectedFiles = selectedFiles.concat(files);
      fileInput.value = '';
      updatePreview();
    });
    fileDrop.addEventListener('dragover', e => {
      e.preventDefault();
      fileDrop.classList.add('dragover');
    });
    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
    fileDrop.addEventListener('drop', e => {
      e.preventDefault();
      fileDrop.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      selectedFiles = selectedFiles.concat(files);
      updatePreview();
    });

    gameNameEl.addEventListener('input', () => {
      btnDoUpload.disabled = !(gameNameEl.value.trim() && selectedFiles.length);
    });

    async function doUpload() {
      if (!hasConfig()) {
        toast('請先完成 GitHub 設定');
        return;
      }
      const name = gameNameEl.value.trim();
      if (!name || !selectedFiles.length) return;

      const slug = slugify(name);
      const note = gameNoteEl.value.trim();
      const basePath = `${settings.path}/${slug}`;

      btnDoUpload.disabled = true;
      progressWrap.classList.add('show');
      progressBar.style.width = '0%';

      try {
        const total = selectedFiles.length;
        const pages = [];

        for (let i = 0; i < total; i++) {
          progressText.textContent = `壓縮中 ${i + 1}/${total}…`;
          progressBar.style.width = ((i / total) * 40) + '%';

          const compressed = await compressImage(selectedFiles[i], 1600, 0.82);
          const pageNum = String(i + 1).padStart(3, '0');
          const fileName = `${pageNum}.jpg`;
          const filePath = `${basePath}/${fileName}`;

          progressText.textContent = `上傳 ${i + 1}/${total}（${Math.round(compressed.size / 1024)} KB）…`;
          progressBar.style.width = (40 + (i / total) * 50) + '%';

          await ghPut(
            filePath,
            compressed.base64,
            `Add ${name} page ${pageNum}`,
            null
          );
          pages.push(fileName);
        }

        // Update index
        progressText.textContent = '更新索引…';
        progressBar.style.width = '95%';

        const existingIdx = MANUALS.findIndex(m => m.slug === slug);
        const entry = {
          name,
          slug,
          note,
          pages: pages.length,
          files: pages,
          updated: new Date().toISOString()
        };
        if (existingIdx >= 0) {
          MANUALS[existingIdx] = entry;
        } else {
          MANUALS.unshift(entry);
        }
        await saveIndex(MANUALS, `Add/Update manual: ${name}`);

        progressBar.style.width = '100%';
        progressText.textContent = '完成！';
        toast(`已上傳「${name}」共 ${pages.length} 頁`);
        setTimeout(() => {
          closeUpload();
          loadIndex(true);
        }, 800);
      } catch (e) {
        console.error(e);
        progressText.textContent = '失敗：' + e.message;
        setStatus('上傳失敗：' + e.message, 'error');
        toast('上傳失敗');
        btnDoUpload.disabled = false;
      }
    }

    // ========== Viewer ==========
    async function openViewer(manual) {
      viewerTitle.textContent = manual.name + (manual.note ? ` · ${manual.note}` : '');
      viewerBody.innerHTML = '<div style="color:var(--muted);padding:20px;text-align:center">載入圖片中…</div>';
      viewerPage.textContent = '—';
      viewerPrev.disabled = true;
      viewerNext.disabled = true;
      viewerModal.classList.add('open');
      document.body.style.overflow = 'hidden';

      const base = `${settings.path}/${manual.slug}`;
      viewerImages = (manual.files || []).map(f => rawUrl(`${base}/${f}`));
      // Fallback if files missing: try sequential probe (not ideal but ok for prototype)
      if (!viewerImages.length && manual.pages) {
        for (let i = 1; i <= manual.pages; i++) {
          viewerImages.push(rawUrl(`${base}/${String(i).padStart(3, '0')}.jpg`));
        }
      }
      viewerIndex = 0;
      showViewerPage();
    }
    function showViewerPage() {
      if (!viewerImages.length) {
        viewerBody.innerHTML = '<div style="color:var(--muted);padding:20px;text-align:center">沒有圖片</div>';
        viewerPage.textContent = '0/0';
        return;
      }
      const src = viewerImages[viewerIndex];
      viewerBody.innerHTML = `<img src="${src}" alt="第 ${viewerIndex + 1} 頁" onerror="this.parentNode.innerHTML='<div style=color:var(--muted);padding:20px;text-align:center>載入失敗（可能是 Private repo 或檔案不存在）</div>'" />`;
      viewerPage.textContent = `${viewerIndex + 1} / ${viewerImages.length}`;
      viewerPrev.disabled = viewerIndex <= 0;
      viewerNext.disabled = viewerIndex >= viewerImages.length - 1;
      viewerBody.scrollTop = 0;
    }
    function closeViewer() {
      viewerModal.classList.remove('open');
      document.body.style.overflow = '';
      viewerImages = [];
      viewerIndex = 0;
    }

    // ========== Render ==========
    function highlight(text, q) {
      if (!q || !text) return text || '';
      const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try {
        return text.replace(new RegExp('(' + escaped + ')', 'gi'), '<span class="highlight">$1</span>');
      } catch (e) { return text; }
    }
    function render() {
      const q = query.trim().toLowerCase();
      let list = MANUALS;
      if (q) {
        list = MANUALS.filter(m =>
          (m.name || '').toLowerCase().includes(q) ||
          (m.note || '').toLowerCase().includes(q) ||
          (m.slug || '').toLowerCase().includes(q)
        );
      }
      totalEl.textContent = MANUALS.length;
      shownEl.textContent = list.length;

      if (!list.length) {
        grid.innerHTML = MANUALS.length
          ? '<div class="empty"><div class="emoji">📭</div>找不到相關遊戲<br><small>試試其他關鍵字</small></div>'
          : '<div class="empty"><div class="emoji">📚</div>尚未有任何說明書<br><small>點右下角 ＋ 開始上傳</small></div>';
        return;
      }

      grid.innerHTML = list.map(m => {
        const date = m.updated ? new Date(m.updated).toLocaleDateString('zh-HK') : '';
        return `
          <article class="card" data-slug="${m.slug}">
            <div><span class="badge green">${m.pages || '?'} 頁</span></div>
            <div class="card-title">${highlight(m.name, query)}</div>
            ${m.note ? `<div class="card-sub">${highlight(m.note, query)}</div>` : ''}
            <div class="meta">${date ? '更新於 ' + date : ''}</div>
          </article>
        `;
      }).join('');
    }

    // ========== Events ==========
    btnSettings.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });
    btnSaveSettings.addEventListener('click', () => {
      saveSettings();
      loadIndex(true);
    });
    btnTestConnection.addEventListener('click', () => {
      saveSettings();
      testConnection();
    });
    btnRefresh.addEventListener('click', () => loadIndex(true));

    let timer;
    qEl.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        query = qEl.value.trim();
        clearBtn.classList.toggle('show', !!query);
        render();
      }, 80);
    });
    clearBtn.addEventListener('click', () => {
      qEl.value = ''; query = ''; clearBtn.classList.remove('show'); qEl.focus(); render();
    });

    fabUpload.addEventListener('click', () => {
      if (!hasConfig()) {
        settingsPanel.classList.add('open');
        toast('請先設定 GitHub');
        return;
      }
      selectedFiles = [];
      gameNameEl.value = '';
      gameNoteEl.value = '';
      previewEl.innerHTML = '';
      progressWrap.classList.remove('show');
      btnDoUpload.disabled = true;
      uploadModal.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
    uploadClose.addEventListener('click', closeUpload);
    function closeUpload() {
      uploadModal.classList.remove('open');
      document.body.style.overflow = '';
      selectedFiles = [];
    }
    btnDoUpload.addEventListener('click', doUpload);

    grid.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      const slug = card.dataset.slug;
      const manual = MANUALS.find(m => m.slug === slug);
      if (manual) openViewer(manual);
    });
    viewerClose.addEventListener('click', closeViewer);
    viewerPrev.addEventListener('click', () => {
      if (viewerIndex > 0) { viewerIndex--; showViewerPage(); }
    });
    viewerNext.addEventListener('click', () => {
      if (viewerIndex < viewerImages.length - 1) { viewerIndex++; showViewerPage(); }
    });
    document.addEventListener('keydown', e => {
      if (viewerModal.classList.contains('open')) {
        if (e.key === 'Escape') closeViewer();
        if (e.key === 'ArrowLeft') viewerPrev.click();
        if (e.key === 'ArrowRight') viewerNext.click();
      }
      if (uploadModal.classList.contains('open') && e.key === 'Escape') closeUpload();
    });

    // Swipe for viewer
    let touchX = null;
    viewerBody.addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
    viewerBody.addEventListener('touchend', e => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].screenX - touchX;
      touchX = null;
      if (Math.abs(dx) < 50) return;
      if (dx < 0) viewerNext.click(); else viewerPrev.click();
    }, { passive: true });

    // Init
    loadSettings();
    loadIndex(false);
  </script>
</body>
</html>
